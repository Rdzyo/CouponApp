version: '3'

services:
  db:
    container_name: CouponAppPostgres
    image: postgres:16-alpine
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=coupon_app
    volumes:
      - postgres-data:/val/lib/postgresql/data

volumes:
  postgres-data: